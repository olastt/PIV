name: Run Tests

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1-5'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Force Node.js 24
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Validate local .env exists
        run: |
          if [ ! -f .env ]; then
            echo "ERROR: .env not found in repository root."
            exit 1
          fi

      - name: Save start time
        run: date +%s > start_time.txt

      - name: Run tests
        run: |
          pytest tests/token/test_token_positive.py::TestTokenPositive::test_get_token_and_save_api_key --alluredir=allure-results --tb=no -q 2>&1 | tee pytest-output.txt
          pytest tests/apikey tests/articles tests/clients tests/clinics tests/discount_card tests/domain_name tests/events tests/medicalcards tests/phone_prefix tests/piv_admissions tests/sms tests/token --alluredir=allure-results --tb=no -q -k "not test_get_token_and_save_api_key" 2>&1 | tee -a pytest-output.txt
        continue-on-error: true

      - name: Parse test results
        run: |
          PASSED=$(grep -oP '\d+(?= passed)' pytest-output.txt | awk '{s+=$1} END {print s+0}')
          FAILED=$(grep -oP '\d+(?= failed)' pytest-output.txt | awk '{s+=$1} END {print s+0}')
          ERROR=$(grep -oP '\d+(?= error)' pytest-output.txt | awk '{s+=$1} END {print s+0}')
          FAILED_TESTS=$(grep -E "^FAILED" pytest-output.txt | sed 's/FAILED //' | sed 's/ - .*//' | head -20 | tr '\n' '|' || echo "")
          echo "PASSED=${PASSED}" >> $GITHUB_ENV
          echo "FAILED=${FAILED}" >> $GITHUB_ENV
          echo "ERROR=${ERROR}" >> $GITHUB_ENV
          echo "FAILED_TESTS=${FAILED_TESTS}" >> $GITHUB_ENV

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          keep_reports: 1

      - name: Install Surge
        run: npm install -g surge@latest

      - name: Deploy to Surge
        run: surge allure-report ${{ secrets.SURGE_DOMAIN }} --token ${{ secrets.SURGE_TOKEN }}
        continue-on-error: true

      - name: Send Bitrix24 notification
        continue-on-error: true
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          BITRIX_CHAT_ID: ${{ secrets.BITRIX_CHAT_ID }}
          PASSED: ${{ env.PASSED }}
          FAILED: ${{ env.FAILED }}
          ERROR: ${{ env.ERROR }}
          FAILED_TESTS: ${{ env.FAILED_TESTS }}
        run: |
          python3 scripts/bitrix_notify.py \
            --platform-label "PIV" \
            --report-url "https://${{ secrets.SURGE_DOMAIN }}"
