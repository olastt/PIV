name: Run Tests
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Force Node.js 24
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV
      - name: Debug env vars
        run: |
          python3 -c "
          from dotenv import load_dotenv
          import os
          load_dotenv()
          print('X_TOKEN:', bool(os.getenv('X_TOKEN')))
          print('DOMAIN:', os.getenv('DOMAIN'))
          print('X_MOBILE_APP:', os.getenv('X_MOBILE_APP'))
          print('CLINIC_ID:', os.getenv('CLINIC_ID'))
          "
      - name: Run tests
        run: pytest tests/ --alluredir=allure-results -q 2>&1 | tee pytest-output.txt
        continue-on-error: true
      - name: Parse test results
        run: |
          PASSED=$(grep -oP '\d+(?= passed)' pytest-output.txt | head -1 || echo "0")
          FAILED=$(grep -oP '\d+(?= failed)' pytest-output.txt | head -1 || echo "0")
          ERROR=$(grep -oP '\d+(?= error)' pytest-output.txt | head -1 || echo "0")
          FAILED_TESTS=$(grep -E "^FAILED" pytest-output.txt | sed 's/FAILED //' | sed 's/ - .*//' | head -20 | tr '\n' '|' || echo "")
          echo "PASSED=${PASSED:-0}" >> $GITHUB_ENV
          echo "FAILED=${FAILED:-0}" >> $GITHUB_ENV
          echo "ERROR=${ERROR:-0}" >> $GITHUB_ENV
          echo "FAILED_TESTS=${FAILED_TESTS}" >> $GITHUB_ENV
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          keep_reports: 1
      - name: Install Surge
        run: npm install -g surge
      - name: Deploy to Surge
        run: surge allure-report ${{ secrets.SURGE_DOMAIN }} --token ${{ secrets.SURGE_TOKEN }}
        continue-on-error: true
